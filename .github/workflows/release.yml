name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --silent

      - name: Build release artifacts
        shell: pwsh
        run: .\tools\build-release.ps1

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyristaSwitch-win-x64-portable
          path: .\artifacts\MyristaSwitch-win-x64-portable\MyristaSwitch.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyristaSwitch-Setup-win-x64
          path: .\artifacts\installer\*.exe
